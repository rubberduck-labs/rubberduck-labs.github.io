<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Intern side. Ingen lenker til den, og noindex holder den unna søkemotorer. Data hentes bare med token. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Live trafikk</title>
    <link rel="icon" type="image/svg+xml" href="/rubberduck-icon.svg" />
    <style>
      :root { --bg: #f1f3f5; --fg: #1f2937; --box: #fff; --muted: #4b5563; --line: #eceef1; --bar1: #c7cdd6; --bar2: #1f2937; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #e5e7eb; --box: #1f2937; --muted: #9ca3af; --line: #374151; --bar1: #4b5563; --bar2: #e5e7eb; } }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.5 system-ui, -apple-system, sans-serif; padding: 24px 16px 64px; font-variant-numeric: tabular-nums; }
      .wrap { max-width: 960px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 20px; display: flex; align-items: center; gap: 10px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #16a34a; animation: pulse 1.6s ease-in-out infinite; }
      .dot.off { background: #9ca3af; animation: none; }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
      .card { background: var(--box); border: 1px solid var(--line); border-radius: 2px; padding: 14px 16px; }
      .card b { display: block; font-size: 30px; line-height: 1.1; }
      .card span { color: var(--muted); font-size: 13px; }
      table { width: 100%; border-collapse: collapse; background: var(--box); border: 1px solid var(--line); }
      th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
      td.t { color: var(--muted); white-space: nowrap; }
      .ev { font-weight: 600; }
      .ev.apply_sent { color: #16a34a; }
      .chart { background: var(--box); border: 1px solid var(--line); border-radius: 2px; padding: 14px 16px 8px; margin-bottom: 24px; }
      .chart h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
      .chart h2 i { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; display: inline-flex; align-items: center; gap: 6px; }
      .chart h2 i::before { content: ""; width: 10px; height: 10px; background: var(--bar1); }
      .chart h2 i.u::before { background: var(--bar2); }
      .chart svg { display: block; width: 100%; height: auto; }
      .chart text { fill: var(--muted); font: 11px system-ui, sans-serif; }
      .chart .grid { stroke: var(--line); }
      .chart .bv { fill: var(--bar1); } .chart .bu { fill: var(--bar2); }
      .login { max-width: 360px; margin-bottom: 16px; }
            .login label { display: block; font-weight: 600; margin-bottom: 6px; }
      .login .row { display: flex; gap: 8px; }
      .login input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid #c9cfd8; border-radius: 2px; background: #fff; color: #111827; }
      .login button { font: inherit; font-weight: 600; padding: 8px 14px; border: 0; border-radius: 2px; background: #111827; color: #fff; cursor: pointer; }
      .login button:disabled { opacity: .6; cursor: default; }
      .login input:focus-visible, .login button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
      .who { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); }
      .who a { color: inherit; }
      .msg:empty { display: none; }
      .msg { color: var(--muted); padding: 24px 0; }
      @media (max-width: 640px) { .hide-s { display: none; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><span class="dot off" id="dot"></span>Live trafikk<span class="who" id="who" hidden></span></h1>
      <div class="cards" id="cards">
        <div class="card"><b id="online">–</b><span>inne nå (siste 5 min)</span></div>
        <div class="card"><b id="views">–</b><span>sidevisninger i dag</span></div>
        <div class="card"><b id="visits">–</b><span>besøk i dag</span></div>
        <div class="card"><b id="visitors">–</b><span>unike besøkende i dag</span></div>
        <div class="card"><b id="clicks">–</b><span>klikket Søk her</span></div>
        <div class="card"><b id="sent">–</b><span>sendte søknad</span></div>
      </div>
      <form class="login" id="login" hidden>
        <label for="email">Identify yourself</label>
        <div class="row"><input id="email" type="email" autocomplete="email" placeholder="name@rubberduck.no" required /><button type="submit">Go</button></div>
      </form>
      <div class="chart" id="chartbox" hidden>
        <h2>Siste 48 timer <i>Sidevisninger</i><i class="u">Unike besøkende</i></h2>
        <svg id="chart" viewBox="0 0 960 220" role="img" aria-label="Sidevisninger og unike besøkende per time, siste 48 timer"></svg>
      </div>
      <div class="msg" id="msg"></div>
      <table id="tbl" hidden>
        <thead><tr><th>Tid</th><th>Hendelse</th><th>Side</th><th class="hide-s">Fra</th><th class="hide-s">Enhet</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <script>
      (function () {
        var API = 'https://cttwgsndqzemsomzuijf.supabase.co/functions/v1/stats';
        var LOGIN = 'https://cttwgsndqzemsomzuijf.supabase.co/functions/v1/stats-login';
        var KEY = 'rd-stats-token', WHO = 'rd-stats-who';
        var token = '', who = '';
        try { token = localStorage.getItem(KEY) || ''; who = localStorage.getItem(WHO) || ''; } catch (e) {}
        var $ = function (id) { return document.getElementById(id); };
        var LABEL = { pageview: 'Besøk', apply_click: 'Klikket Søk her', apply_sent: 'Sendte søknad', contact_sent: 'Sendte henvendelse', linkedin_click: 'Klikket LinkedIn' };
        function ago(iso) {
          var s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
          return s < 60 ? s + ' s siden' : Math.round(s / 60) + ' min siden';
        }
        function cell(tr, text, cls) { var td = document.createElement('td'); td.textContent = text || ''; if (cls) td.className = cls; tr.appendChild(td); return td; }
        // Hendelser som kommer mens fanen ikke er i fokus telles i tittelen: «Live trafikk (12)».
        var TITLE = 'Live trafikk', seen = null, missed = 0;
        function setTitle() { document.title = missed ? TITLE + ' (' + missed + ')' : TITLE; }
        document.addEventListener('visibilitychange', function () { if (!document.hidden) { missed = 0; setTitle(); } });
        function count(events) {
          var fresh = 0;
          events.forEach(function (e) { var k = e.created_at; if (seen && !seen.has(k)) fresh++; });
          events.forEach(function (e) { (seen = seen || new Set()).add(e.created_at); });
          if (fresh && document.hidden) { missed += fresh; setTitle(); }
        }
        var NS = 'http://www.w3.org/2000/svg';
        function el(name, attrs, text) { var n = document.createElementNS(NS, name); for (var k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; return n; }
        var hourFmt = new Intl.DateTimeFormat('nb-NO', { hour: '2-digit', hourCycle: 'h23', timeZone: 'Europe/Oslo' });
        var dayFmt = new Intl.DateTimeFormat('nb-NO', { day: 'numeric', month: 'numeric', timeZone: 'Europe/Oslo' });
        var fullFmt = new Intl.DateTimeFormat('nb-NO', { weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'Europe/Oslo' });
        function niceTop(max) { var p = Math.pow(10, Math.floor(Math.log10(Math.max(max, 1)))), m = Math.max(max, 1) / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
        function drawChart(h) {
          var svg = $('chart'); svg.textContent = '';
          if (!h || !h.length) { $('chartbox').hidden = true; return; }
          $('chartbox').hidden = false;
          var W = 960, H = 220, L = 34, R = 4, T = 8, B = 26, iw = W - L - R, ih = H - T - B, bw = iw / h.length;
          var top = niceTop(Math.max.apply(null, h.map(function (x) { return x.visninger; })));
          var y = function (v) { return T + ih - (v / top) * ih; };
          [0, top / 2, top].forEach(function (v) {
            svg.appendChild(el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), class: 'grid' }));
            svg.appendChild(el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }, String(Math.round(v * 10) / 10)));
          });
          h.forEach(function (x, i) {
            var d = new Date(x.t), g = el('g', {});
            var x0 = L + i * bw;
            g.appendChild(el('rect', { x: x0 + 1, y: y(x.visninger), width: Math.max(bw - 2, 1), height: ih - (y(x.visninger) - T), class: 'bv' }));
            g.appendChild(el('rect', { x: x0 + bw * 0.25, y: y(x.besokende), width: bw * 0.5, height: ih - (y(x.besokende) - T), class: 'bu' }));
            g.appendChild(el('title', {}, fullFmt.format(d) + ': ' + x.visninger + ' visninger, ' + x.besokende + ' unike'));
            svg.appendChild(g);
            var hr = hourFmt.format(d);
            if (+hr % 6 === 0) svg.appendChild(el('text', { x: x0 + bw / 2, y: H - 8, 'text-anchor': 'middle' }, hr === '00' ? dayFmt.format(d) : hr));
          });
        }
        function draw(d) {
          count(d.events);
          drawChart(d.hourly);
          $('online').textContent = d.online; $('views').textContent = d.today.visninger; $('visits').textContent = d.today.besok; $('visitors').textContent = d.today.besokende;
          $('clicks').textContent = d.today.klikk_sok; $('sent').textContent = d.today.sendt;
          var body = $('rows'); body.textContent = '';
          d.events.forEach(function (e) {
            var tr = document.createElement('tr');
            cell(tr, ago(e.created_at), 't');
            cell(tr, LABEL[e.event] || e.event, 'ev ' + e.event);
            cell(tr, e.path);
            cell(tr, e.campaign || e.referrer || 'direkte', 'hide-s');
            cell(tr, [e.screen, e.browser].filter(Boolean).join(' · '), 'hide-s');
            body.appendChild(tr);
          });
          $('tbl').hidden = !d.events.length;
          $('msg').textContent = d.events.length ? '' : 'Ingen hendelser de siste 30 minuttene.';
        }
        function signedOut(text) {
          token = '';
          try { localStorage.removeItem(KEY); localStorage.removeItem(WHO); } catch (e) {}
          $('dot').className = 'dot off'; $('who').hidden = true; $('chartbox').hidden = true; $('tbl').hidden = true;
          $('login').hidden = false; $('cards').hidden = true; $('msg').textContent = text || '';
        }
        function showWho() {
          var w = $('who'); w.textContent = '';
          w.appendChild(document.createTextNode(who ? who + ' · ' : ''));
          var a = document.createElement('a'); a.href = '#'; a.textContent = 'Logg ut';
          a.addEventListener('click', function (e) { e.preventDefault(); signedOut(''); });
          w.appendChild(a); w.hidden = false;
        }
        function tick() {
          if (!token) return;
          $('login').hidden = true; $('cards').hidden = false; showWho();
          fetch(API, { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
            if (r.status === 401) throw new Error('401');
            if (!r.ok) throw new Error('Feil ' + r.status);
            return r.json();
          }).then(function (d) { $('dot').className = 'dot'; draw(d); setTimeout(tick, 5000); })
            .catch(function (e) {
              if (e.message === '401') return signedOut('Expired.');
              $('dot').className = 'dot off'; $('msg').textContent = e.message; setTimeout(tick, 10000);
            });
        }
        function post(url, body) {
          return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Noe gikk galt'); return j; }); });
        }
        $('login').addEventListener('submit', function (e) {
          e.preventDefault();
          var btn = e.target.querySelector('button'); btn.disabled = true; $('msg').textContent = '';
          post(LOGIN, { email: $('email').value }).then(function () {
            $('msg').textContent = 'Check Slack.';
          }).catch(function (err) { $('msg').textContent = 'No.'; }).then(function () { btn.disabled = false; });
        });
        // Lenken fra Slack har engangstokenet i #-delen. Det byttes mot et innloggingsbevis, og #-delen fjernes fra adressen.
        var m = /^#t=([0-9a-f]{64})$/.exec(location.hash);
        if (m) {
          history.replaceState(null, '', location.pathname);
          $('msg').textContent = '…';
          post(LOGIN, { token: m[1] }).then(function (j) {
            token = j.session; who = j.email;
            try { localStorage.setItem(KEY, token); localStorage.setItem(WHO, who); } catch (e) {}
            $('msg').textContent = ''; tick();
          }).catch(function (err) { signedOut('Expired.'); });
        } else if (token) tick();
        else signedOut('');
      })();
    </script>
  </body>
</html>
